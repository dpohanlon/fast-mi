name: Build and Publish Wheels

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    pull_request:
        branches:
            - main

jobs:
    build_wheels:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # os: [ubuntu-latest, macos-13, macos-14]
                # python-version: ["3.10", "3.11", "3.12", "3.13"]
                os: [macos-14]
                python-version: ["3.13"]

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  eval `ssh-agent -s`
                  ssh-add - <<< "${{ secrets.PRIVATE_SSH_KEY }}"
                  git submodule update --init --recursive
                  python -m pip install --upgrade pip

            # - name: Install dependencies Linux
            #   if: runner.os == 'Linux'
            #   run: |
            #     sudo apt install python3-dev
            #     sudo apt install libboost-all-dev
            #     sudo apt install libeigen3-dev

            - name: Install dependencies Mac
              if: runner.os == 'macOS'
              run: |
                  brew install eigen
                  brew install libomp
                  brew install boost
                  echo "OpenMP_ROOT=$(brew --prefix)/opt/libomp" >> $GITHUB_ENV

            # Make sure we're only building wheels for the OS version we're on
            - name: Set macOS deployment target
              if: runner.os == 'macOS'
              run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> $GITHUB_ENV

            - name: Build wheels with cibuildwheel
              uses: pypa/cibuildwheel@v2.22.0
              with:
                  output-dir: wheelhouse
              env:
                  CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
                  CIBW_SKIP: "*musllinux*"
                  OpenMP_ROOT: ${{ env.OpenMP_ROOT }}
                  CIBW_BEFORE_ALL_LINUX: |
                      yum -y install wget
                      # Install Boost from source - this takes a while, unfortunately
                      BOOST_VERSION=1.81.0
                      wget https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.gz
                      tar -xzf boost_${BOOST_VERSION//./_}.tar.gz
                      cd boost_${BOOST_VERSION//./_}
                      ./bootstrap.sh --prefix=/usr/local
                      ./b2 install
                      # Install Eigen from source
                      EIGEN_VERSION=3.4.0
                      wget https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
                      tar -xzf eigen-${EIGEN_VERSION}.tar.gz
                      cd eigen-${EIGEN_VERSION}
                      mkdir build && cd build
                      cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local
                      make install
                      # Add deploy key to get NB repo
                      eval `ssh-agent -s`
                      ssh-add - <<< '${{ secrets.PRIVATE_SSH_KEY }}'

            - name: Run Tests
              if: runner.os == 'Linux'
              env:
                  PYVER_NO_DOTS: ${{ matrix.python-version }}
              run: |
                  pip install nose2
                  pip install scipy seaborn matplotlib
                  PY_ABI_TAG=cp${PYVER_NO_DOTS//./}
                  VERSION=$(git describe --tags --abbrev=0)
                  WHL_PATH=$(ls wheelhouse/fast_mutual_information-${VERSION#v}-${PY_ABI_TAG}*-manylinux_2_28_x86_64.whl)
                  pip install "$WHL_PATH"
                  cd tests
                  nose2

            - name: Upload wheels
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
                  path: wheelhouse/*.whl

    release:
        needs: [build_wheels]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist/
                  merge-multiple: true
            - name: Create Release and Upload Assets
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  artifacts: dist/*
                  artifactContentType: application/gzip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish:
        needs: [build_wheels]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  path: dist/
                  merge-multiple: true
            - name: Publish to test PyPI
              uses: pypa/gh-action-pypi-publish@v1.4.2
              with:
                  password: ${{ secrets.TEST_PYPI_API_TOKEN }}
                  repository_url: https://test.pypi.org/legacy/
            - name: Publish tagged version to PyPI
              uses: pypa/gh-action-pypi-publish@v1.4.2
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
