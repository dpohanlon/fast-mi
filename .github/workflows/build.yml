name: Build and Publish Wheels

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    pull_request:
        branches:
            - main

jobs:
    build_wheels:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-14]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  eval `ssh-agent -s`
                  ssh-add - <<< "${{ secrets.PRIVATE_SSH_KEY }}"
                  git submodule update --init --recursive
                  python -m pip install --upgrade pip

            - name: Install dependencies Mac
              if: runner.os == 'macOS'
              run: |
                  brew install llvm libomp eigen boost
                  echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
                  echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
                  echo "OpenMP_ROOT=$(brew --prefix)/opt/libomp" >> $GITHUB_ENV
                  echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix llvm)" >> $GITHUB_ENV

            - name: Set macOS deployment target
              if: runner.os == 'macOS'
              run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> $GITHUB_ENV

            - name: Build wheels with cibuildwheel
              uses: pypa/cibuildwheel@v2.22.0
              with:
                  output-dir: wheelhouse
              env:
                  CC: ${{ env.CC }}
                  CXX: ${{ env.CXX }}
                  OpenMP_ROOT: ${{ env.OpenMP_ROOT }}
                  CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
                  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
                  CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
                  CIBW_ARCHS_LINUX: "x86_64"
                  CIBW_SKIP: "*musllinux*"
                  CIBW_TEST_REQUIRES: "nose2 scipy"
                  CIBW_TEST_SOURCES: "tests"
                  CIBW_TEST_COMMAND: "cd tests && nose2"
                  CIBW_BEFORE_ALL_LINUX: |
                      yum -y install wget libatomic
                      BOOST_VERSION=1.81.0
                      wget https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.gz
                      tar -xzf boost_${BOOST_VERSION//./_}.tar.gz
                      cd boost_${BOOST_VERSION//./_}
                      ./bootstrap.sh --prefix=/usr/local
                      ./b2 install
                      EIGEN_VERSION=3.4.0
                      wget https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VERSION}/eigen-${EIGEN_VERSION}.tar.gz
                      tar -xzf eigen-${EIGEN_VERSION}.tar.gz
                      cd eigen-${EIGEN_VERSION}
                      mkdir build && cd build
                      cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local
                      make install

            - name: Upload wheels
              uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.os }}
                  path: wheelhouse/*.whl

    build_sdist:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Build sdist
              run: |
                  python -m pip install --upgrade pip build
                  python -m build --sdist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: dist/*.tar.gz

    release:
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')

        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: "*"
                  path: dist/
                  merge-multiple: true

            - name: List release files
              run: ls -R dist

            - name: Create Release and Upload Assets
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  artifacts: dist/*
                  artifactContentType: application/octet-stream
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish:
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')

        steps:
            - name: Download distribution artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: "*"
                  path: dist/
                  merge-multiple: true

            - name: List files to be published
              run: ls -R dist

            - name: Publish to test PyPI
              uses: pypa/gh-action-pypi-publish@v1.13.0
              with:
                  repository_url: https://test.pypi.org/legacy/
                  password: ${{ secrets.TEST_PYPI_API_TOKEN }}

            - name: Publish tagged version to PyPI
              uses: pypa/gh-action-pypi-publish@v1.13.0
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
